<style>
/* ضع ملفات خطوطك هنا عند الاستضافة:
@font-face{font-family:"PT Bold Heading";src:url("PT-Bold-Heading.woff2") format("woff2");}
@font-face{font-family:"Alyamama";src:url("Alyamama.woff2") format("woff2");} */

:root{
  color-scheme: dark;
  --navy-deep:#060c22;
  --navy:#0a1330;
  --navy-raised:#111d45;
  --gold:#d4af6a;
  --gold-bright:#f3d99b;
  --gold-dim:#8c7444;
  --ink:#f4efe3;
  --ink-soft:#b7b3a8;
  --line:rgba(212,175,106,.22);
  --f-head:"PT Bold Heading","Reem Kufi","Segoe UI",Tahoma,sans-serif;
  --f-body:"Alyamama","Tajawal","Segoe UI",Tahoma,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#f4efe3; } }
:root[data-theme="dark"]{ --ink:#f4efe3; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--navy-deep); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100%;
  font-family:var(--f-body); color:var(--ink);
  background:
    radial-gradient(120% 60% at 50% 0%, #16245a 0%, transparent 60%),
    radial-gradient(80% 50% at 50% 110%, #1a1430 0%, transparent 70%),
    var(--navy-deep);
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%; max-width:440px;
  padding:40px 22px 32px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  position:relative;
}

/* ---------- الصورة بإطار مضيء ---------- */
.portrait{
  position:relative; width:148px; height:148px; margin-bottom:22px;
}
.portrait .halo{
  position:absolute; inset:-6px; border-radius:50%;
  background:conic-gradient(from 0deg, var(--gold-dim), var(--gold-bright), var(--gold), var(--gold-dim), var(--gold-bright), var(--gold-dim));
  animation:spin 9s linear infinite;
  filter:drop-shadow(0 0 18px rgba(243,217,155,.35));
}
.portrait .halo::after{
  content:""; position:absolute; inset:3px; border-radius:50%; background:var(--navy);
}
.portrait .face{
  position:absolute; inset:4px; border-radius:50%; overflow:hidden;
  background:linear-gradient(160deg,var(--navy-raised),var(--navy-deep));
  display:grid; place-items:center;
}
.portrait img{ width:100%; height:100%; object-fit:cover; }
.portrait .initials{
  font-family:var(--f-head); font-size:46px; color:var(--gold);
  letter-spacing:.02em;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- الاسم واللقب ---------- */
h1{
  font-family:var(--f-head); font-weight:700;
  font-size:clamp(28px,8vw,34px); line-height:1.25; margin:0 0 6px;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold) 55%,var(--gold-dim));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.title{ font-size:16px; font-weight:500; color:var(--ink); margin:0 0 14px; }
.bio{
  font-size:14.5px; line-height:1.85; color:var(--ink-soft);
  margin:0 0 26px; max-width:34ch;
}
.rule{
  width:72px; height:1px; margin:0 auto 24px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* ---------- الزر الرئيسي ---------- */
.save{
  width:100%; border:0; cursor:pointer;
  font-family:var(--f-head); font-size:18px; color:#1b1406;
  padding:17px 20px; border-radius:16px;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold) 60%,#b8924f);
  box-shadow:0 10px 30px -8px rgba(212,175,106,.55), inset 0 1px 0 rgba(255,255,255,.55);
  position:relative; overflow:hidden;
  transition:transform .15s ease;
}
.save::after{
  content:""; position:absolute; top:0; bottom:0; width:40%; left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sheen 4.5s ease-in-out 1.2s infinite;
}
@keyframes sheen{ 0%{left:-60%} 30%,100%{left:130%} }
.save:active{ transform:scale(.98); }

/* ---------- الأزرار السريعة ---------- */
.actions{
  width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0 22px;
}
.act{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:16px 6px 13px; border-radius:14px; text-decoration:none;
  color:var(--ink); font-size:13.5px; font-weight:500;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);
  transition:border-color .2s, transform .15s;
}
.act svg{ width:24px; height:24px; color:var(--gold); }
.act:active{ transform:scale(.97); }
.act:hover{ border-color:rgba(212,175,106,.55); }

.qr-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:14px; border-radius:14px; cursor:pointer;
  font-family:var(--f-body); font-size:15px; font-weight:700; color:var(--gold-bright);
  background:transparent; border:1px solid var(--gold-dim);
}
.qr-btn svg{ width:20px; height:20px; }

/* ---------- السوشيال ---------- */
.social{ display:flex; gap:14px; justify-content:center; margin:26px 0 8px; }
.social a{
  width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
  border:1px solid var(--line); color:var(--gold);
  transition:background .2s, color .2s;
}
.social a:hover{ background:var(--gold); color:var(--navy); }
.social svg{ width:19px; height:19px; }

.foot{ margin-top:18px; font-size:12px; color:var(--gold-dim); }

/* ---------- نافذة QR ---------- */
.modal{
  position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(3,6,18,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.modal.open{ opacity:1; pointer-events:auto; }
.sheet{
  width:100%; max-width:440px; padding:26px 24px calc(28px + env(safe-area-inset-bottom,0px));
  border-radius:26px 26px 0 0; text-align:center;
  background:linear-gradient(180deg,var(--navy-raised),var(--navy));
  border-top:1px solid var(--gold-dim);
  transform:translateY(40px); transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.modal.open .sheet{ transform:none; }
.sheet .grip{ width:42px; height:4px; border-radius:2px; background:var(--gold-dim); margin:0 auto 18px; }
.sheet h2{ font-family:var(--f-head); font-size:20px; color:var(--gold-bright); margin:0 0 6px; }
.sheet p{ font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; }
.qr-frame{
  display:inline-block; padding:14px; border-radius:18px; background:#fff;
  box-shadow:0 0 0 1px var(--gold), 0 0 0 6px rgba(212,175,106,.15);
}
#qr img, #qr canvas{ display:block; width:220px !important; height:220px !important; }
.close{
  margin-top:20px; width:100%; padding:13px; border-radius:12px; cursor:pointer;
  font-family:var(--f-body); font-size:15px; font-weight:700;
  background:transparent; color:var(--ink); border:1px solid var(--line);
}

/* ---------- تنبيه ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:60;
  transform:translate(-50%,20px); opacity:0; transition:.3s;
  background:var(--navy-raised); color:var(--ink); border:1px solid var(--gold-dim);
  padding:12px 18px; border-radius:12px; font-size:14px; max-width:88vw; text-align:center;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- زر اللغة ---------- */
.lang{
  position:absolute; top:14px; left:16px; z-index:5;
  min-width:58px; padding:8px 14px; border-radius:999px; cursor:pointer;
  font-family:var(--f-body); font-size:14px; font-weight:700; color:var(--gold-bright);
  background:rgba(10,19,48,.6); border:1px solid var(--gold-dim);
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
}
.lang:hover{ border-color:var(--gold); }

:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }
@media (prefers-reduced-motion: reduce){
  .portrait .halo,.save::after{ animation:none; }
}
</style>
</head>

</main>

const $ = id => document.getElementById(id);

// بناء المحتوى حسب اللغة
function render(lang){
  LANG = lang;
  CUR = lang === "en" ? Object.assign({}, CONFIG, EN) : CONFIG;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  $("name").textContent = CUR.name;
  $("jobTitle").textContent = CUR.title;
  $("bio").textContent = CUR.bio;
  $("foot").textContent = CUR.org;
  document.title = CUR.name + " | " + CUR.title;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = UI[lang][el.dataset.i]; });
  $("langBtn").textContent = UI[lang].toggle;
  $("waBtn").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(CUR.whatsappMsg);
  $("qr").innerHTML = ""; qrDrawn = false;   // يُعاد رسم QR باللغة الجديدة
  try { localStorage.setItem("cardLang", lang); } catch(e) {}
}

  if (!url) return;
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  a.setAttribute("aria-label", LABELS[k]); a.innerHTML = ICONS[k];
  $("social").appendChild(a);
});

// تنبيه
let tTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tTimer); tTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

// ---------- توليد vCard ----------
function esc(v){ return String(v||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"); }
function buildVCard(){
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N;CHARSET=UTF-8:" + esc(CUR.lastName) + ";" + esc(CUR.firstName) + ";;;",
    "FN;CHARSET=UTF-8:" + esc(CUR.name),
    "ORG;CHARSET=UTF-8:" + esc(CUR.org),
    "TITLE;CHARSET=UTF-8:" + esc(CUR.title),
    "TEL;TYPE=CELL,VOICE:" + CONFIG.phone,
    "EMAIL;TYPE=INTERNET,WORK:" + CONFIG.email
  ];
  if (CONFIG.website) lines.push("URL:" + CONFIG.website);
  if (CUR.address) lines.push("ADR;CHARSET=UTF-8;TYPE=WORK:;;" + esc(CUR.address) + ";;;;");
  lines.push("NOTE;CHARSET=UTF-8:" + esc(CUR.bio));
  lines.push("END:VCARD");
  return lines.join("\r\n");
}

$("saveBtn").addEventListener("click", () => {
  const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = EN.firstName + "-" + EN.lastName + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(UI[LANG].saved);
});

// ---------- QR ----------
let qrDrawn = false;
function cardLink(){
  const u = new URL(CONFIG.cardUrl || location.href.split("#")[0]);
  if (LANG === "en") u.searchParams.set("lang", "en"); else u.searchParams.delete("lang");
  return u.toString();
}
function openQR(){
  if (!qrDrawn && window.QRCode){
    new QRCode($("qr"), { text: cardLink(), width: 440, height: 440,
      colorDark: "#0a1330", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    qrDrawn = true;
  }
  $("modal").classList.add("open"); $("qrClose").focus();
}
function closeQR(){ $("modal").classList.remove("open"); $("qrOpen").focus(); }
$("qrOpen").addEventListener("click", openQR);
$("qrClose").addEventListener("click", closeQR);
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeQR(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeQR(); });

// التبديل بين اللغتين
$("langBtn").addEventListener("click", () => render(LANG === "ar" ? "en" : "ar"));

// اللغة الأولى: من الرابط (?lang=en) ثم آخر اختيار للزائر ثم العربية
let startLang = "ar";
try {
  const p = new URLSearchParams(location.search).get("lang");
  startLang = p === "en" || p === "ar" ? p : (localStorage.getItem("cardLang") || "ar");
} catch(e) {}
render(startLang === "en" ? "en" : "ar");
</script>
